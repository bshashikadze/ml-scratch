[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlscratch"
version = "0.1.0"
description = "Classical machine learning methods implemented from scratch in Python, with a focus on high-dimensional low-sample-size regimes encountered in proteomics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bachuki Shashikadze" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.4",   # validation only, never imported by package code
    "matplotlib>=3.8",      # for notebooks
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlscratch"]